CONFIG_GPIO=y
CONFIG_SPI=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="ADS1299_NRF54"
CONFIG_BT_MAX_CONN=1

CONFIG_LOG=y
CONFIG_PRINTK=y
CONFIG_SPI_LOG_LEVEL_DBG=y
CONFIG_NRFX_SPIM_LOG=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Free the default UART pins so ADS1299 SPI can use the selected P0 pins.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_SERIAL=n

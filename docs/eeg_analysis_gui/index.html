<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EEG Analysis Lab</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="mark">EEG</div>
        <div>
          <h1>EEG Analysis Lab</h1>
          <p>CSV raw signal analyzer</p>
        </div>
      </div>

      <label class="dropzone" for="csvFile">
        <input id="csvFile" type="file" accept=".csv,text/csv">
        <span class="drop-title">CSV 파일 선택</span>
        <span id="fileName" class="drop-subtitle">ADS1299 저장 CSV를 올려주세요</span>
      </label>

      <section class="panel">
        <h2>분석 설정</h2>
        <label>
          샘플링 주파수 Hz
          <input id="sampleRate" type="number" min="1" step="0.1" value="250">
        </label>
        <label>
          분석 채널
          <select id="channelSelect"></select>
        </label>
        <label>
          표시 시간 s
          <input id="timeWindow" type="number" min="1" step="1" value="12">
        </label>
        <label>
          Band-pass Hz
          <div class="pair">
            <input id="lowCut" type="number" min="0" step="0.1" value="1">
            <input id="highCut" type="number" min="1" step="0.5" value="40">
          </div>
        </label>
        <label class="check-row">
          <input id="notchToggle" type="checkbox" checked>
          <span>50/60 Hz notch</span>
        </label>
        <label class="check-row">
          <input id="convertUv" type="checkbox" checked>
          <span>ADS1299 count를 uV로 변환</span>
        </label>
        <div class="pair">
          <label>
            Vref
            <input id="vref" type="number" min="0.1" step="0.1" value="4.5">
          </label>
          <label>
            Gain
            <input id="gain" type="number" min="1" step="1" value="24">
          </label>
        </div>
        <button id="analyzeBtn" type="button">분석 실행</button>
      </section>

      <section class="panel">
        <h2>채널 상태</h2>
        <div id="channelList" class="channel-list"></div>
      </section>
    </aside>

    <section class="workspace">
      <div class="status-bar">
        <div>
          <strong id="statusTitle">CSV 대기 중</strong>
          <span id="statusDetail">파일을 올리면 자동으로 분석합니다.</span>
        </div>
        <button id="exportBtn" type="button" disabled>요약 CSV 저장</button>
      </div>

      <section class="metrics">
        <article>
          <span>Duration</span>
          <strong id="metricDuration">-</strong>
        </article>
        <article>
          <span>Sampling</span>
          <strong id="metricFs">-</strong>
        </article>
        <article>
          <span>RMS</span>
          <strong id="metricRms">-</strong>
        </article>
        <article>
          <span>Alpha Peak</span>
          <strong id="metricAlphaPeak">-</strong>
        </article>
        <article>
          <span>Alpha Relative</span>
          <strong id="metricAlphaRel">-</strong>
        </article>
      </section>

      <nav class="tabs" aria-label="plot tabs">
        <button class="tab active" data-view="raw">Raw</button>
        <button class="tab" data-view="filtered">Filtered</button>
        <button class="tab" data-view="fft">FFT</button>
        <button class="tab" data-view="psd">PSD</button>
        <button class="tab" data-view="power">Relative Power</button>
      </nav>

      <section class="plot-grid">
        <article class="plot-card">
          <header>
            <h2 id="mainPlotTitle">Raw EEG</h2>
            <span id="mainPlotMeta">-</span>
          </header>
          <canvas id="mainCanvas" width="1400" height="640"></canvas>
        </article>
        <article class="plot-card compact">
          <header>
            <h2>상대 Power</h2>
            <span>Delta, Theta, Alpha, Beta, Gamma</span>
          </header>
          <canvas id="powerCanvas" width="900" height="430"></canvas>
        </article>
        <article class="plot-card compact">
          <header>
            <h2>Band Table</h2>
            <span id="bandTableMeta">분석 전</span>
          </header>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Band</th>
                  <th>Hz</th>
                  <th>Power</th>
                  <th>Relative</th>
                </tr>
              </thead>
              <tbody id="bandTable"></tbody>
            </table>
          </div>
        </article>
      </section>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
